name: Build Tweak Dylib

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Theos & Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang make git ldid
          export THEOS=/opt/theos
          sudo git clone --recursive https://github.com/theos/theos.git $THEOS

      - name: Compile Dylib and Package Deb
        run: |
          export THEOS=/opt/theos
          make

      - name: Upload Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: Compiled-Liber-Files
          path: |
            obj/
            packages/
