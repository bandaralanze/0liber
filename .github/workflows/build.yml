name: Build Tweak

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Theos
        run: |
          sudo apt-get update
          sudo apt-get install -y clang make git ldid
          export THEOS=/opt/theos
          sudo git clone --recursive https://github.com/theos/theos.git $THEOS
          
      - name: Make
        run: |
          export THEOS=/opt/theos
          make
          
      - name: Upload
        uses: actions/upload-artifact@v3
        with:
          name: package
          path: packages/*.deb
