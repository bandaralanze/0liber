name: Build Tweak

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Theos & Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang make git curl
          export THEOS=~/theos
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
          sudo curl -L -o ~/theos/bin/ldid https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid.x86_64
          sudo chmod +x ~/theos/bin/ldid
          
      - name: Make
        run: |
          export THEOS=~/theos
          make ARCHS=arm64
          
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: packages/*.deb
