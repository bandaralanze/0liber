name: Build Tweak

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Theos
        run: |
          sudo apt-get update
          sudo apt-get install -y clang make git curl
          sudo mkdir -p /opt/theos
          sudo git clone --recursive https://github.com/theos/theos.git /opt/theos
          sudo rm -rf /opt/theos/sdks
          sudo git clone https://github.com/theos/sdks.git /opt/theos/sdks
          sudo curl -L -o /opt/theos/bin/ldid https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid.x86_64
          sudo chmod +x /opt/theos/bin/ldid
          
      - name: Make
        run: |
          export THEOS=/opt/theos
          make ARCHS=arm64
          
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: packages/*.deb
